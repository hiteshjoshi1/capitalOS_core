# Dependabot: automated dependency updates for every supply-chain surface in the
# repo. Security updates (from Dependabot alerts) are enabled in the repository
# settings and open PRs immediately; the version updates below run weekly.
# Minor/patch bumps are grouped per ecosystem to keep PR volume low; majors
# arrive as individual PRs so they can be reviewed on their own.
# cooldown: a release is proposed only once it's 14 days old (the release-age rule, D-1).
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the native port) isn't supported by typescript-eslint yet (D-16).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @solana/web3.js 2+ is a rewrite on @solana/kit; every @solana/wallet-adapter-* release
      # (the wallet connection the Crypto Wallets page uses) requires ^1.99 (#95).
      - dependency-name: "@solana/web3.js"
        update-types: ["version-update:semver-major"]
      # @playwright/test must equal the Playwright image pinned in tools/Dockerfile (scripts/e2e-smoke.sh
      # refuses a mismatch, so a lone npm bump fails CI). Dependabot can't group across ecosystems here,
      # so it bumps only the image (the /tools block below); bump @playwright/test on that same PR (#451).
      - dependency-name: "@playwright/test"

  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    groups:
      # eth-account/eth-keys minors need the eth-utils/eth-abi majors, so they move together (D-14).
      eth:
        patterns: ["eth-*"]
      pip-minor-patch:
        update-types: [minor, patch]
        # A new SQLAlchemy series (2.1) is reviewed on its own (D-14).
        exclude-patterns: ["sqlalchemy", "SQLAlchemy"]

  # Dev tooling for the LangGraph task workflow (make orch-bootstrap).
  - package-ecosystem: pip
    directory: /orchestration
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      orchestration-minor-patch:
        update-types: [minor, patch]

  # API base image (python:3.12-slim).
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    ignore:
      # Python minor upgrades (3.12 -> 3.13) are a deliberate runtime change.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # Web image bases (#263): node (build stage) and nginx-unprivileged (runtime).
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    ignore:
      # A Node major is a deliberate runtime change (it follows .nvmrc).
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # Postgres, Loki, Grafana, Alloy pins in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      compose-images:
        update-types: [minor, patch]
    ignore:
      # A Postgres major needs pg_upgrade / dump+restore of the data volume.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # Grafana 13.x scanned far worse than 12.4.x (issue 206); revisit majors by hand.
      - dependency-name: grafana/grafana
        update-types: ["version-update:semver-major"]

  # Images run outside compose (MCP server, Trivy, Playwright): see tools/Dockerfile.
  # A Playwright image bump fails the smoke job until web/package.json's @playwright/test (and the
  # lock) is bumped to the same version on that PR: `cd web && npm i -D -E @playwright/test@<ver>` (#451).
  - package-ecosystem: docker
    directory: /tools
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

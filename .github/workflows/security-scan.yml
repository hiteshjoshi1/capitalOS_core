name: Security Scan

# Image vulnerability scanning with Trivy (local twin: `make security-scan`).
# - api-image: builds the runtime API image on a freshly pulled base and FAILS
#   on fixable HIGH/CRITICAL findings.
# - compose-images: third-party images pinned in docker-compose.yml plus tool
#   images from tools/Dockerfile (e.g. the MCP server); report only.
# Results are uploaded to the repository's Security tab (code scanning is free
# for public repositories). The weekly run catches new CVEs in unchanged images.
on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, alongside Dependabot
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_FLAGS: --quiet --skip-version-check --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL
  # SARIF upload needs a token with security-events:write, which fork PRs don't get.
  CAN_UPLOAD: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Trivy image (tools/Dockerfile)
        run: echo "TRIVY_IMAGE=$(scripts/tool-image.sh trivy)" >> "$GITHUB_ENV"

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Build runtime API image (fresh base)
        run: docker build --pull --target runtime -t capitalos-api:scan api

      - name: Scan (SARIF for the Security tab)
        run: |
          # shellcheck disable=SC2086 # TRIVY_FLAGS is intentionally word-split
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache" -v "$PWD:/out" \
            "$TRIVY_IMAGE" image $TRIVY_FLAGS --format sarif --output /out/api-image.sarif capitalos-api:scan

      - name: Upload SARIF
        if: always() && env.CAN_UPLOAD == 'true' && hashFiles('api-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: api-image.sarif
          category: trivy-api-image

      - name: Fail on fixable HIGH/CRITICAL
        run: |
          # shellcheck disable=SC2086 # TRIVY_FLAGS is intentionally word-split
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache" \
            "$TRIVY_IMAGE" image $TRIVY_FLAGS --table-mode detailed --exit-code 1 capitalos-api:scan

  list-compose-images:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: list
        name: List third-party images (docker-compose.yml + tools/Dockerfile)
        run: |
          images=$(docker compose -f docker-compose.yml --profile observability config --format json \
            | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; refs=sorted({v["image"] for v in s.values() if "image" in v and "build" not in v} | set(sys.argv[1:])); print(json.dumps([{"ref": r, "name": r.split("@")[0]} for r in refs]))' \
              "$(scripts/tool-image.sh mcp-toolbox)")
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "$images"

  compose-images:
    name: compose-images (${{ matrix.image.name }})
    needs: list-compose-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.list-compose-images.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Trivy image (tools/Dockerfile)
        run: echo "TRIVY_IMAGE=$(scripts/tool-image.sh trivy)" >> "$GITHUB_ENV"

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ github.run_id }}-${{ strategy.job-index }}
          restore-keys: trivy-db-

      - name: Scan ${{ matrix.image.name }} (report only)
        run: |
          # shellcheck disable=SC2086 # TRIVY_FLAGS is intentionally word-split
          docker run --rm -v "${{ runner.temp }}/trivy-cache:/root/.cache" -v "$PWD:/out" \
            "$TRIVY_IMAGE" image $TRIVY_FLAGS --image-src remote --format sarif --output /out/image.sarif "${{ matrix.image.ref }}"
          # shellcheck disable=SC2086
          docker run --rm -v "${{ runner.temp }}/trivy-cache:/root/.cache" \
            "$TRIVY_IMAGE" image $TRIVY_FLAGS --image-src remote --table-mode detailed "${{ matrix.image.ref }}"

      - name: Upload SARIF
        if: always() && env.CAN_UPLOAD == 'true' && hashFiles('image.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: image.sarif
          # Digest-free, so a Dependabot digest bump updates the same analysis.
          category: trivy-${{ matrix.image.name }}

  # Weekly/on-demand only (not on PRs, to stay well under registry rate limits):
  # CycloneDX SBOMs for every image as a 90-day artifact, plus provenance and
  # signature checks for every pinned image (scripts/verify-image.sh).
  sbom-and-provenance:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify provenance / signatures of pinned images
        run: make verify-images

      - name: Generate SBOMs
        run: make sbom

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.run_id }}
          path: sbom/*.cdx.json
          retention-days: 90

name: PR Validate

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Python locks have no transitive package under 14 days old (D-1, #81)
        run: |
          scripts/check-lock-age.py api/requirements.txt api/requirements.in
          scripts/check-lock-age.py api/requirements-dev.txt api/requirements-dev.in api/requirements.in
          scripts/check-lock-age.py orchestration/requirements.txt orchestration/requirements.in

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Backend tests
        run: make test-backend

      - name: Frontend tests
        run: make test-frontend

      - name: Optional E2E
        run: |
          if [ -f web/playwright.config.ts ] || [ -f web/playwright.config.js ]; then
            # #407: run in the pinned Playwright image (browser and fonts built in, as the smoke job
            # does), instead of `playwright install --with-deps`, which apt-installed ~30 packages
            # from Ubuntu's servers on every run and failed when they were unreachable.
            (cd web && npm ci)
            image=$(scripts/tool-image.sh playwright)
            docker run --rm --init --ipc=host --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=1 \
              -v "$PWD/web:/work" -w /work "$image" node_modules/.bin/playwright test
          else
            echo "Playwright config not found. Skipping e2e."
          fi

  # #154: every migration applied to an empty Postgres 16 with the same runner as
  # `make db-migrate`, a second run that must change nothing, the schema diffed against
  # migrations/schema.sql, then the Postgres-marked tests (pytest -m postgres) against it,
  # including the cross-user isolation sweep over every GET route. Same as `make db-schema-check`.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure .env exists
        run: touch .env

      - name: Migrate an empty Postgres, check the schema, run the Postgres tests
        run: make db-schema-check

  # #73: the real stack (Postgres + API + the production web container) on demo data, every page
  # at phone and desktop width, and screenshot diffs against web/tests/smoke/__screenshots__.
  # Same as `make e2e-smoke`. On failure, the report (live screenshots, expected/actual/diff
  # images, traces) is in the "smoke-report" artifact; only synthetic demo data is in it.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Full-stack smoke and screenshot diffs
        run: make e2e-smoke

      - name: Upload the smoke report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-report
          path: |
            web/playwright-report/smoke
            web/test-results/smoke
          retention-days: 7
          if-no-files-found: ignore

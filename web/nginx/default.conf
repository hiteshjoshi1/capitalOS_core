# CapitalOS web (#263). Published on 127.0.0.1 only (docker-compose.yml): Docker Desktop hides the
# client's address from containers, so access control is the port binding plus `tailscale serve`
# (tailnet-only HTTPS, `make tailnet-serve`), not an IP check here.

# Requests must name this machine (localhost) or its tailnet name: a page on some other site that
# DNS-rebinds its own name to 127.0.0.1 gets nothing (what Vite's allowedHosts did).
map $host $capitalos_host_ok {
    default         0;
    localhost       1;
    127.0.0.1       1;
    "[::1]"         1;
    ~\.ts\.net$     1;
}

# The address the browser used, port included (#358: Google sign-in picks its redirect URL by it):
# tailscale serve's X-Forwarded-Host when present, else the Host header as sent.
map $http_x_forwarded_host $capitalos_forwarded_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Statement uploads (INGEST_MAX_UPLOAD_MB, default 25) plus multipart overhead.
    client_max_body_size 30m;

    # Docker's DNS: the api container is looked up per request (cached 10s), so recreating it on
    # a deploy (new IP) doesn't leave nginx pointing at the old one.
    resolver 127.0.0.11 valid=10s ipv6=off;

    if ($capitalos_host_ok = 0) {
        return 421;
    }

    include /etc/nginx/snippets/security-headers.conf;

    # /api/* -> the API with the prefix stripped, like the dev server's proxy (vite.config.ts).
    location /api/ {
        set $capitalos_api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $capitalos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The browser's address for the login throttle (#152); the API trusts it only from a
        # private-range peer (AUTH_TRUSTED_PROXIES), which this container is.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $capitalos_forwarded_host;
        # Realtime websocket (/api/realtime/ws).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    # Hashed build output: safe to cache for good.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is the single-page app; index.html is never cached, so a deploy shows at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

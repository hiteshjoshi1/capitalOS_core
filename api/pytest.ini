[pytest]
testpaths = tests
pythonpath = .
addopts = -q
markers =
    postgres: runs on a migrated Postgres 16 (TEST_POSTGRES_URL, set by `make db-schema-check`); skipped without it (#154)
# Warnings (#452). A run used to print ~450k warnings, so a new one went unseen.
# Later lines win over earlier ones.
filterwarnings =
    # Any warning attributed to our own code fails the test: the app, and the tests
    # (test files load as top-level `test_*` modules, helpers as `tests.*`, plus `conftest`).
    error:::app(\.|$)
    error:::(tests\.|test_|conftest$)
    # sqlite3's built-in date/datetime adapters (deprecated in Python 3.12) must stay
    # replaced: tests/conftest.py registers explicit ones.
    error:The default date adapter is deprecated:DeprecationWarning
    error:The default datetime adapter is deprecated:DeprecationWarning
    # Starlette 1.x wants the `httpx2` package for its TestClient and warns once at import
    # while it falls back to `httpx`. httpx2 is a new, separate client stack (httpx2 +
    # httpcore2 + truststore) released almost weekly, and the app itself still uses httpx;
    # adopting it is its own change. Remove this line once httpx2 is in requirements-dev.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
    # pandas deprecates the xlrd engine (legacy .xls); moving the .xls parsers to the
    # calamine engine needs a new dependency (python-calamine) and its own tests.
    # Remove this line once no parser reads with engine="xlrd".
    ignore:The xlrd engine is deprecated:DeprecationWarning

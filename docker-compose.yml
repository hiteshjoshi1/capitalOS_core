# Runtime hardening applied to every long-running service: no privilege
# escalation via setuid binaries, no Linux capabilities, and a process cap.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 512

# Shared by the `api` service and the `api-dev` tooling service.
x-api-common: &api-common
  <<: *hardening
  # Non-root (the image's `app` user by default). On a Linux host whose user
  # isn't 10001, set CAPITALOS_UID/CAPITALOS_GID in .env so ./data stays writable.
  user: "${CAPITALOS_UID:-10001}:${CAPITALOS_GID:-10001}"
  env_file:
    - path: .env
      required: false
  environment: &api-env
    DATABASE_URL: ${DATABASE_URL:-postgresql://capitalos:capitalos@postgres:5432/capitalos}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_FORMAT: ${LOG_FORMAT:-logfmt}
    DB_SLOW_QUERY_MS: ${DB_SLOW_QUERY_MS:-500}
    LOG_SAMPLE_RATE_HIGH_FREQ: ${LOG_SAMPLE_RATE_HIGH_FREQ:-0.10}
    UPLOAD_STALE_DAYS: ${UPLOAD_STALE_DAYS:-30}
  depends_on:
    - postgres
  volumes:
    - ./data:/app/data
    - ./config:/app/config:ro
    - ./api/app:/app/app:ro

services:
  postgres:
    <<: *hardening
    image: postgres:16.15
    container_name: capitalos-postgres
    # Runs straight as the image's postgres user (data dir is owned by 999), so
    # the root entrypoint + gosu privilege drop and its capabilities aren't needed.
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=999,gid=999
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capitalos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capitalos}
      POSTGRES_DB: ${POSTGRES_DB:-capitalos}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    <<: *api-common
    build:
      context: ./api
      target: runtime
    container_name: capitalos-api
    read_only: true
    tmpfs:
      - /tmp
    environment:
      <<: *api-env
      # Writable home for library caches (e.g. yfinance) on the read-only root fs.
      HOME: /tmp
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn app.main:app --host=0.0.0.0 --port=8000 --reload

  # Test/lint/typecheck tooling (`make test-backend`, `make lint`, `make typecheck`).
  # Same config as `api`, built from the `dev` target; only started via `compose run`.
  api-dev:
    <<: *api-common
    build:
      context: ./api
      target: dev
    profiles:
      - tools

  loki:
    <<: *hardening
    image: grafana/loki:3.7.9
    container_name: capitalos-loki
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - observability
    profiles:
      - observability
    command:
      - -config.file=/etc/loki/local-config.yaml
      - -config.expand-env=true
    env_file:
      - path: ./config/observability.env.example
      - path: ./config/observability.env
        required: false
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./config/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  grafana:
    <<: *hardening
    image: grafana/grafana:12.4.14
    container_name: capitalos-grafana
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - observability
    profiles:
      - observability
    env_file:
      - path: ./config/observability.env.example
      - path: ./config/observability.env
        required: false
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-capitalos}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  alloy:
    <<: *hardening
    image: grafana/alloy:v1.21.3
    container_name: capitalos-alloy
    # The image defaults to root; with the socket proxy it needs no host access.
    user: "473:473"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - observability
      - docker-api
    profiles:
      - observability
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    env_file:
      - path: ./config/observability.env.example
      - path: ./config/observability.env
        required: false
    depends_on:
      - loki
      - docker-socket-proxy
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Log read positions survive restarts, so logs aren't re-shipped.
      - alloy-data:/var/lib/alloy/data

  # The only container with the Docker socket. It exposes a read-only subset of
  # the Docker API (list/inspect containers, logs, events, networks) on an
  # internal network that only Alloy joins; every write endpoint is refused.
  docker-socket-proxy:
    <<: *hardening
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: capitalos-docker-socket-proxy
    # Runs as root only to open the socket; no caps, read-only fs, internal network.
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/lib/haproxy
    profiles:
      - observability
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 0
    networks:
      - docker-api
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  # postgres + api stay on the project's default network (the MCP server joins it).
  observability:
  docker-api:
    internal: true

volumes:
  pgdata:
  loki-data:
  grafana-data:
  alloy-data:
